# mcl-sentinel — how to run this service.
#
# Runnable as-is. It carries what the SERVICE knows about itself: its image, its
# port, the environment variables its own code reads, and its health check.
#
#   MCL_REALM=<64-hex> \
#     MCL_REALM_KEY=<hex of the realm's public signing key> \
#     MACULA_STATION_SEEDS=station.example:4433 \
#     MACULA_STATION_NODE_IDS=<64-hex node id of that station> \
#     docker compose -p mcl-sentinel -f deploy/docker-compose.yml up -d
#
# IF YOU DEPLOY THROUGH SOMETHING ELSE, keep this file anyway and let the other
# thing carry PLACEMENT: which host, which station, which realm, which secret
# store. The split is worth holding to, because the alternative is a config table
# in a README and the real environment somewhere else, drifting apart with
# nothing checking them.

services:
  mcl-sentinel:
    image: ghcr.io/macula-services/mcl-sentinel:latest
    container_name: mcl-sentinel
    restart: unless-stopped
    # HOST NETWORKING IS NOT LAZINESS. macula stations are reachable over IPv6
    # only, and a default docker bridge has no IPv6, so a bridged container
    # connects and then sits there with no healthy links, looking fine. If you
    # do want a bridge, give it IPv6 explicitly.
    network_mode: host
    volumes:
      # ⚠ REQUIRED, BECAUSE THIS SERVICE OPENS A STORE. Without the mount the
      # record lives inside the container and every recreate destroys it, which
      # is the same as not keeping one, and watchtower recreates containers as a
      # matter of routine.
      #
      # ON A BULK DRIVE, NOT THE ROOT FILESYSTEM, on any fleet node. Those boot
      # from a small eMMC with a root partition measured in single-digit gigabytes
      # and keep application data on /bulk0.
      - ${MCL_DATA:-/bulk0/mcl-sentinel}:/data
      # ⚠ NAMED, SO IT OUTLIVES THE CONTAINER. The node identity key is the
      # sentinel's verified identity: every fact it publishes carries it.
      - secrets:/etc/mcl/secrets
      # DB-IP Lite databases, read-only. Fill it with scripts/fetch-dbip-lite.sh
      # (monthly). Empty, the facts simply carry no geolocation.
      - ${MCL_SENTINEL_GEOIP_DIR:-/bulk0/mcl-sentinel-geoip}:/geoip:ro
    labels:
      # Only meaningful if you run watchtower: it pulls a new :latest and
      # recreates the container. Harmless otherwise.
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # No default. A service that guesses its realm announces itself where
      # nobody can attribute it, and that looks exactly like a healthy node.
      - MCL_REALM=${MCL_REALM:?set MCL_REALM to the 64-hex realm tag}
      # The same realm by NAME, which the topics carry. The service refuses to
      # start unless sha256 of this is MCL_REALM.
      - MCL_REALM_NAME=${MCL_REALM_NAME:?set MCL_REALM_NAME to the realm name, e.g. io.macula}
      # The wardens whose reports are taken: their node ids, 64 hex each,
      # comma-separated, read from each warden's own stored identity. No
      # default: without it the sentinel refuses to start.
      - MCL_SENTINEL_WARDENS=${MCL_SENTINEL_WARDENS:?set MCL_SENTINEL_WARDENS to the wardens' 64-hex node ids}
      # The TRUST ANCHOR, and a different thing from MCL_REALM above: that is
      # an identifier, this is the realm's public signing key, hex encoded.
      # Without it nothing org-namespaced resolves, the boot claim never
      # reaches the realm, and the container stays green while being
      # unreachable. Public material, so it belongs here and not in secrets.
      - MCL_REALM_KEY=${MCL_REALM_KEY:?set MCL_REALM_KEY to the hex-encoded public realm signing key}
      # No default either: naming a realm costs nothing, dialling somebody's
      # production station from every dev clone does. The 11.x dial is PINNED:
      # every seed host pairs with its station's node id, index for index
      # (D5) -- mcl_om refuses to boot a pool with an unpinned seed, since
      # that dial could never connect anyway.
      - MACULA_STATION_SEEDS=${MACULA_STATION_SEEDS:?set MACULA_STATION_SEEDS to "host[:port][,host[:port]...]"}
      - MACULA_STATION_NODE_IDS=${MACULA_STATION_NODE_IDS:?set MACULA_STATION_NODE_IDS to the matching 64-hex node ids, comma-separated}
      - MCL_NODE_NAME=mcl_sentinel
      - MCL_NODE_HOST=127.0.0.1
      - MCL_COOKIE=mcl_sentinel
      # Host networking means a port already bound on this host fails SILENTLY.
      - MCL_HEALTH_PORT=8470
      # Where the store lands, matching the volume above. `store_id/0' is
      # appended by mcl_om, so the store itself is at /data/mcl_sentinel_store.
      - MCL_DATA_DIR=/data

# The identity volume, NAMED HERE rather than left to the project name, so a
# `docker compose -p` with a different name reuses the same key instead of
# quietly starting a second identity. Deleting it retires the node id.
volumes:
  secrets:
    name: mcl-sentinel-secrets
